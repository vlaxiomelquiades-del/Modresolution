name: Build ResScale LeviLauncher Mod

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android ARM64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared

      - name: Build
        run: cmake --build build --parallel

      - name: Verify
        run: |
          test -f build/libresscale.so
          file build/libresscale.so
          readelf -h build/libresscale.so | grep -E 'Class|Machine'

      - name: Package LeviPack
        run: |
          set -eux
          rm -rf dist
          mkdir -p dist/resscale/lib/arm64-v8a
          cp build/libresscale.so dist/resscale/lib/arm64-v8a/
          cp manifest.json dist/resscale/manifest.json
          cd dist/resscale
          zip -9 -r ../../resscale-v1.0.1-arm64-v8a.levipack .
          cd ../..
          sha256sum build/libresscale.so *.levipack > SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resscale-v1.0.1-arm64-v8a
          if-no-files-found: error
          path: |
            build/libresscale.so
            *.levipack
            SHA256SUMS.txt

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/libresscale.so
            *.levipack
            SHA256SUMS.txt

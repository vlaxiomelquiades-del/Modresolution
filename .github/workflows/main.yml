name: Build LeviLauncher Mod

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android ARM64
    runs-on: ubuntu-24.04

    steps:
      # ─────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ─────────────────────────────────────────────
      # Java
      # ─────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ─────────────────────────────────────────────
      # Android SDK
      # ─────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ─────────────────────────────────────────────
      # Android NDK
      # ─────────────────────────────────────────────
      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      # ─────────────────────────────────────────────
      # CMake / Ninja
      # ─────────────────────────────────────────────
      - name: Setup CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

          cmake --version
          ninja --version

      # ─────────────────────────────────────────────
      # Configure project
      # ─────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared

      # ─────────────────────────────────────────────
      # Build .so
      # ─────────────────────────────────────────────
      - name: Build mod
        run: |
          cmake --build build --parallel

      # ─────────────────────────────────────────────
      # Verify .so
      # ─────────────────────────────────────────────
      - name: Verify shared library
        run: |
          echo "Build directory:"
          find build -maxdepth 3 -type f -print

          test -f build/libresscale.so

          echo
          echo "Library information:"
          file build/libresscale.so

          echo
          echo "Library size:"
          ls -lh build/libresscale.so

      # ─────────────────────────────────────────────
      # Prepare LeviPack
      # ─────────────────────────────────────────────
      - name: Prepare LeviPack
        shell: bash
        run: |
          set -e

          rm -rf dist
          mkdir -p dist/resscale/lib/arm64-v8a

          cp build/libresscale.so \
            dist/resscale/lib/arm64-v8a/libresscale.so

          cp manifest-1.json \
            dist/resscale/manifest-1.json

          echo "LeviPack contents:"
          find dist/resscale -type f -print

      # ─────────────────────────────────────────────
      # Create .levipack
      # ─────────────────────────────────────────────
      - name: Create LeviPack
        shell: bash
        run: |
          set -e

          VERSION="${GITHUB_REF_NAME:-dev}"

          cd dist/resscale

          zip -9 -r \
            "../../resscale-${VERSION}-arm64-v8a.levipack" \
            .

          cd ../..

          echo "Created package:"
          ls -lh \
            "resscale-${VERSION}-arm64-v8a.levipack"

      # ─────────────────────────────────────────────
      # SHA256
      # ─────────────────────────────────────────────
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -e

          sha256sum \
            build/libresscale.so \
            *.levipack \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # ─────────────────────────────────────────────
      # Upload artifacts
      # ─────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resscale-android-arm64
          if-no-files-found: error
          path: |
            build/libresscale.so
            *.levipack
            SHA256SUMS.txt

      # ─────────────────────────────────────────────
      # GitHub Release
      # ─────────────────────────────────────────────
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/libresscale.so
            *.levipack
            SHA256SUMS.txt
